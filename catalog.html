<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="css/style.css" />

  />

<body>
<header>
  <div>
    <h1>Изотопный Ярус</h1>

  </div>
  <nav>
    <a href="index.html">Конструктор</a>

</header>

<main class="catalog-main">
  <div class="panel filters">
    <input id="catalog-search" type="text" placeholder="Поиск: Око Бога, изотоп, рука..." />
    <select id="catalog-category"></select>
  </div>

  <div id="catalog-list" class="catalog-grid"></div>

<div class="hud-decor" aria-hidden="true">
  <div class="hud-binary">01001001 01001010
    01010011 01001111
    01010100 01001111
    01010000 01000101
    01001101 01001101
    01001011 01000010
    01010011 01000011
    01000001 01001110</div>

  <div class="hud-vertical">BREACH PROTOCOL 104.008</div>

  <div class="hud-barcode"></div>
  <div class="hud-terminal">ROOT@IZOTOP-YARUS:~#</div>
</div>

<script src="vendor/js-yaml.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
